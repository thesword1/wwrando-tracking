name: Release

# Builds the Linux release (a PyInstaller one-file executable in a tarball) and, for a pushed v* tag, attaches it to a
# GitHub Release for that tag. Started by hand, it only uploads the tarball as a workflow artifact.
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      version:
        description: Version (defaults to version.txt)

permissions:
  contents: write

jobs:
  linux:
    name: Linux
    # The oldest supported runner, so the executable runs on distros with an older glibc.
    runs-on: ubuntu-22.04

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-cursor0 libxcb-xinerama0 libegl1 libxkbcommon0
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_full.txt
      - name: Set version
        id: vars
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${INPUT_VERSION:-$(cat version.txt)}"
          fi
          echo "$VERSION" > version.txt
          echo "version=$VERSION" >> $GITHUB_OUTPUT
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
      - name: Build executable
        run: python -m PyInstaller --log-level=WARN wwrando.spec
      - name: Bundle release archive
        run: python build.py
      - name: Smoke test
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          EXE="dist/wwrando-${{ steps.vars.outputs.version }}-linux-x64/wwrando-tracking"
          test "$("$EXE" --version)" = "${{ steps.vars.outputs.version }}"
          "$EXE" --help > /dev/null
          # The GUI should still be running (not crashed) when the timeout stops it.
          set +e
          timeout 30 "$EXE"
          STATUS=$?
          set -e
          test $STATUS -eq 124
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wwrando-${{ steps.vars.outputs.version }}-linux-x64
          path: dist/wwrando-${{ steps.vars.outputs.version }}-linux-x64.tar.gz
      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/wwrando-${{ steps.vars.outputs.version }}-linux-x64.tar.gz" \
            --repo "$GITHUB_REPOSITORY" \
            --title "wwrando-tracking ${{ steps.vars.outputs.version }}" \
            --notes "Linux build of ${{ steps.vars.outputs.version }}. See CHANGELOG.md for what's new and README.md for how to use it. A vanilla North American Wind Waker ISO is required and not included."
