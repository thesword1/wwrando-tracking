name: Test

on:
  push:
    branches: [ master ]
    paths-ignore:
      - 'docs/**'
      - '.github/workflows/publish-site.yml'
  pull_request:
    branches: [ master ]
    paths-ignore:
      - 'docs/**'
      - '.github/workflows/publish-site.yml'
  workflow_dispatch:

jobs:
  test:
    name: Linux
    runs-on: ubuntu-latest

    env:
      QT_QPA_PLATFORM: offscreen

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-cursor0 libxcb-xinerama0 libegl1 libxkbcommon0
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_full.txt
      - name: Prepare test env vars
        run: |
          echo "WW_RANDO_OUTPUT_DIR=$PWD/wwrando-output" >> .env
          mkdir -p wwrando-output
      - name: Test with pytest
        # Tests that read/save game files need a vanilla ISO, which is never available in CI.
        run: pytest test -m "not saving" -q
