name: Test

on:
  push:
    branches: [ master ]
    paths-ignore:
      - 'docs/**'
      - '.github/workflows/publish-site.yml'
  pull_request:
    branches: [ master ]
    paths-ignore:
      - 'docs/**'
      - '.github/workflows/publish-site.yml'
  workflow_dispatch:

jobs:
  test:
    name: Linux (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.14']

    env:
      QT_QPA_PLATFORM: offscreen
      # GCC 15 defaults to C23 (where bool is a keyword), which breaks gclib's pyfastyaz0yay0 C speedup.
      CFLAGS: -std=gnu17

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - name: Install Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-cursor0 libxcb-xinerama0 libegl1 libxkbcommon0
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ "${{ matrix.python-version }}" = "3.14" ]; then
            # Python 3.14: install the same runtime/test deps but let pip resolve
            # 3.14-compatible versions (requirements_full.txt pins numpy==2.2.3,
            # which has no 3.14 wheels) and skip the optional C speedups, which
            # have pure-Python fallbacks in gclib.
            pip install QtPy PySide6 "ruamel.yaml~=0.19.1" "pillow>=12.2.0" appdirs certifi tqdm "numpy>=2.3" imagequant "pytest~=9.0.3" "pytest-cov~=7.1.0" "pytest-dotenv~=0.5.2" "pytest-qt~=4.5.0"
          else
            pip install -r requirements_full.txt
          fi
      - name: Prepare test env vars
        run: |
          echo "WW_RANDO_OUTPUT_DIR=$PWD/wwrando-output" >> .env
          mkdir -p wwrando-output
      - name: Test with pytest
        # Tests that read/save game files need a vanilla ISO, which is never available in CI.
        run: pytest test -m "not saving" -q
