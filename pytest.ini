[pytest]
testpaths =
  test
pythonpath =
  test
markers =
  saving: Tests reading and saving game files (deselect with '-m "not saving"')
  dolphin: Tests that launch Dolphin (flatpak) with a vanilla ISO; deselected unless selected with '-m dolphin'
  slow: Long-running seed matrices (e.g. offline parity over many seeds); deselected unless selected with '-m slow'
